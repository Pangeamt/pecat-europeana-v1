# Entidad de Backstage de PECAT-E. La registra un Location estático en
# PangeanicAI/ai-devops-platform (catalog-info.yaml), igual que service-golden-path:
# Backstage no descubre repos de la organización Pangeamt por sí solo.
# TechDocs se construye desde mkdocs.yml + docs/ de este mismo repo (rama stable).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: pecat-europeana
  title: PECAT-E — post-edición asistida (Europeana)
  description: >
    Plataforma web de post-edición: sube un documento, lo traduce con DAAIT
    (/content/pecat, con el perfil del proyecto), lo puntúa con MTQE v1/v2, pasa
    un juez LLM (/content/post_edit) y deja la revisión humana segmento a segmento
    antes de descargar el documento reconstruido (Okapi Tikal / SDLXLIFF).
  tags: [nextjs, prisma, bullmq, daait, mtqe, okapi, post-edition]
  links:
    - url: https://ai4cpecat.pangeanic.com
      title: Producción (según env.example)
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: Pangeamt/pecat-europeana-v1
spec:
  type: website
  lifecycle: production
  owner: group:default/developers
  providesApis: [pecat-europeana-api]
---
# Entidad API de PECAT-E. Sin spec endpoint a endpoint a propósito: es la API
# interna de Next.js (app/api/*, ~38 rutas), consumida solo por el frontend de
# este mismo proyecto vía services/*.ts (auth por sesión Next-Auth), no pensada
# para integración externa. Mapa de rutas real: README-architecture.md.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: pecat-europeana-api
  title: PECAT-E internal API
  description: >
    API interna de Next.js (app/api/*), consumida solo por el frontend de este
    mismo proyecto. Detalle de rutas en README-architecture.md.
spec:
  type: openapi
  lifecycle: production
  owner: group:default/developers
  definition: |
    openapi: 3.0.0
    info:
      title: PECAT-E internal API
      version: '1.0'
      description: >-
        API interna de Next.js (app/api/*), consumida solo por el frontend de
        este mismo proyecto. Detalle de rutas en README-architecture.md.
    servers:
      - url: https://ai4cpecat.pangeanic.com/api
    paths: {}
