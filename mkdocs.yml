site_name: PECAT-E (pecat-europeana-v1)
# docs/ también guarda planes de trabajo internos (PLAN-*.md): no se publican ni se indexan.
exclude_docs: |
  PLAN-*.md
nav:
  - Inicio: index.md
  - Arquitectura: architecture.md
  - Desarrollo: development.md
  - Operación y despliegue: operations.md
  - Variables de entorno: secrets.md
  - Manual de usuario:
      - Presentación: manual/index.md
      - Acceso y cuenta: manual/acceso.md
      - Administrador: manual/administrador.md
      - Usuario: manual/usuario.md
      - El editor: manual/editor.md
      - Formatos y ejemplos: manual/formatos.md
plugins:
  - techdocs-core
